# /etc/nginx/nginx.conf 전체를 교체하는 설정.
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # TLS 는 앞단 nginx-proxy 가 종단한다. 리다이렉트는 상대 경로로 보낸다.
        absolute_redirect off;

        # 해시가 붙은 빌드 산출물: 내용이 바뀌면 파일명이 바뀌므로 영구 캐시.
        # 없는 파일을 index.html 로 가리면 옛 HTML 이 JS 자리에 HTML 을 받아
        # 빈 화면이 되므로 반드시 404 를 낸다.
        location /static/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # 그 외 전부(index.html, config.js, public 자산, SPA 라우트 경로)는
        # 캐시하지 않는다. 라우트 경로는 index.html 로 fallback 한다.
        location / {
            try_files $uri /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}

events {}
